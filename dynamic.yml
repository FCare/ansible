http:
  middlewares:
    # Authentification service-à-service via JWT Authentik (Bearer), sans
    # redirection navigateur — utilisé pour thebrain/unmute (voir
    # mosquitto-auth-authentik/main.py::forwardauth).
    authentik-bearer:
      forwardAuth:
        address: "http://mosquitto-auth-authentik:8080/forwardauth"
        trustForwardHeader: true
        authRequestHeaders:
          - Authorization
          - X-API-Key

    # Autorise l'affichage en iframe depuis Nextcloud uniquement (remplace le
    # X-Frame-Options SAMEORIGIN envoye par le nginx du service)
    allow-frame-nextcloud:
      headers:
        customResponseHeaders:
          X-Frame-Options: ""
        contentSecurityPolicy: "frame-ancestors 'self' https://cloud.caronboulme.fr"

    # Sablier (serveur sur nestor:10000) : reveille le conteneur a la premiere
    # requete, l'endort apres sessionDuration sans visite. A placer APRES
    # authentik-sso pour que seuls les utilisateurs authentifies reveillent.
    sablier-acestep:
      plugin:
        sablier:
          sablierUrl: "http://192.168.1.224:10000"
          group: acestep
          sessionDuration: 30m
          dynamic:
            displayName: "ACE-Step"
            theme: ghost
            refreshFrequency: 5s

    sablier-zanime:
      plugin:
        sablier:
          sablierUrl: "http://192.168.1.224:10000"
          group: zanime
          sessionDuration: 20m
          dynamic:
            displayName: "Z-Anime"
            theme: ghost
            refreshFrequency: 5s

    # Redirect www and root domain to assistant
    redirect-to-assistant:
      redirectRegex:
        regex: "^https://(www\\.)?caronboulme\\.fr(/.*)?$"
        replacement: "https://chat.caronboulme.fr${2}"
        permanent: true

    # Restriction aux réseaux locaux pour l'endpoint /cert
    local-networks-only:
      ipAllowList:
        sourceRange:
          - "192.168.1.0/24"
          - "192.168.2.0/24"
          - "127.0.0.1/32"

    # Authentik ForwardAuth - Authentification SSO réutilisable pour plusieurs services
    authentik-sso:
      forwardAuth:
        address: "http://authentik_server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Authentik-Username
          - X-Authentik-Groups
          - X-Authentik-Email
          - X-Authentik-Name
          - X-Authentik-Uid
          - X-Authentik-Jwt
          - X-Authentik-Meta-Jwks
          - X-Authentik-Meta-Outpost
          - X-Authentik-Meta-Provider
          - X-Authentik-Meta-App
          - X-Authentik-Meta-Version


  routers:
    # Redirect root and www domains to assistant
    root-redirect:
      rule: "Host(`caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      middlewares:
        - redirect-to-assistant
        
    www-redirect:
      rule: "Host(`www.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      middlewares:
        - redirect-to-assistant

    # vLLM FastAPI - The Brain (API key only)
    thebrain:
      rule: "Host(`thebrain.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: vllm-service
      middlewares:
        - authentik-bearer

        # vLLM FastAPI - The Brain (API key only)
    thebrain-think:
      rule: "Host(`thebrain-think.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: vllm-think-service
      middlewares:
        - authentik-bearer

    # TTS Service - Unmute Talk (API key only)
    unmute-talk:
      rule: "Host(`unmute-talk.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: tts-service
      middlewares:
        - authentik-bearer

    # STT Service - Unmute Transcript (API key only)
    unmute-transcript:
      rule: "Host(`unmute-transcript.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: stt-service
      middlewares:
        - authentik-bearer

    # VSCode Server - code-server (Authentik SSO, migré depuis VK — aucun
    # appelant service-à-service trouvé pour cet host, contrairement à voxcpm2)
    code:
      rule: "Host(`code.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: code-service
      middlewares:
        - authentik-sso

    # VoxCPM2 TTS Service (Authentik SSO, migré depuis VK — panoramix l'appelle
    # en interne via Docker DNS, joshua était le seul appelant public, arrêté)
    voxcpm2:
      rule: "Host(`voxcpm2.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: voxcpm2-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # MusicGen - interface Gradio hébergée sur la machine locale nestor (hors
    # Docker) — Authentik SSO, même pattern que voxcpm2 : accès navigateur
    # uniquement, aucun appelant service-à-service
    musicgen:
      rule: "Host(`musicgen.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: musicgen-service
      middlewares:
        - authentik-sso
        - sablier-acestep
        - allow-frame-nextcloud

    # Z-Anime - interface web (nestor:8189) : prompt en français -> Gemma -> ComfyUI,
    # galerie partagée. Authentik SSO ; pas de Sablier ici : l'UI est toujours allumée
    # et réveille elle-même ComfyUI (groupe Sablier "zanime") à chaque génération.
    zanime:
      rule: "Host(`zanime.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: zanime-ui-service
      middlewares:
        - authentik-sso

    # ComfyUI brut (nestor:8188, GPU1) - Authentik SSO puis Sablier : le conteneur ne
    # tourne que pendant l'usage. Sous-domaine dédié : ComfyUI ne supporte pas un sous-chemin.
    comfyui:
      rule: "Host(`comfyui.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: zanime-service
      middlewares:
        - authentik-sso
        - sablier-zanime

    # Traefik Dashboard - Authentik SSO, migré depuis VK — restreint au groupe
    # "authentik Admins" côté Authentik (Policy Binding), pas ouvert à tous les
    # utilisateurs contrairement aux autres routes migrées
    traefik-dashboard:
      rule: "Host(`traefik.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: api@internal
      middlewares:
        - authentik-sso

    # Panoramix Backend - Authentik SSO (migré depuis VK, même pattern que
    # joshua-backend-api) - handle_client lit X-Authentik-Username injecté par
    # Traefik au lieu du cookie vk_session
    panoramix-backend-api:
      rule: "Host(`panoramix.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-backend-service
      middlewares:
        - authentik-sso

    # Panoramix Frontend - page de déconnexion publique (pas de authentik-sso —
    # sinon le retour de post_logout_redirect_uri redéclenche immédiatement une
    # nouvelle authentification), même pattern que photobook-logged-out
    panoramix-logged-out:
      rule: "Host(`chat.caronboulme.fr`) && PathPrefix(`/logged-out`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      priority: 100

    # Panoramix Frontend - chat.caronboulme.fr (Authentik SSO, migré depuis VK)
    panoramix-frontend:
      rule: "Host(`chat.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # Authentik - Fournisseur OIDC (dédié à Immich pour l'instant, delegue à Google)
    sso:
      rule: "Host(`sso.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: authentik-service

    # Photos Service - Immich (no authentication - public access)
    photos:
      rule: "Host(`photos.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photos-service

    # Cloud Service - Nextcloud (gère sa propre authentification OIDC via Authentik)
    cloud:
      rule: "Host(`cloud.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: nextcloud-service

    # Collabora Online - editeur bureautique pour Nextcloud (heberge sur nestor).
    # Pas de forward-auth : Nextcloud et le navigateur le contactent directement
    # (protocole WOPI), l'acces est restreint cote Collabora par aliasgroup1.
    office:
      rule: "Host(`office.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: collabora-service

    # Jellyfin - mediatheque de films (nestor). Derriere Authentik (forward-auth) comme les autres services ;
    # Jellyfin garde en plus son propre login. Les applications natives (TV, mobiles) ne passent donc plus.
    films:
      rule: "Host(`films.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: jellyfin-service
      middlewares:
        - authentik-sso

    # Kavita - bibliotheque de livres (nestor). Derriere Authentik (forward-auth) comme les autres services ;
    # Kavita garde en plus son propre login. Les applications externes (OPDS) ne passent donc plus.
    livres:
      rule: "Host(`livres.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: kavita-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # Kavita OPDS : point d'entree pour les applications de lecture (KOReader, Moon+ Reader...).
    # Seuls /api/opds/ et /api/image/ (couvertures) contournent Authentik ; l'acces exige la cle d'API personnelle
    # de l'utilisateur (dans l'URL pour OPDS, en parametre apiKey pour les images), sinon Kavita repond 401. Priorite superieure a la route "livres".
    livres-opds:
      rule: "Host(`livres.caronboulme.fr`) && (PathPrefix(`/api/opds/`) || PathPrefix(`/api/image/`))"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: kavita-service
      priority: 200

    # Ren'Py (nestor) : portail des jeux exportes pour le web + Studio (SDK Ren'Py dans un bureau web, /studio/).
    # Derriere Authentik ; la passerelle nginx de nestor n'accepte que cette machine.
    renpy:
      rule: "Host(`renpy.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: renpy-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # Sesame - Serveur de certificats CA (accès local uniquement)
    sesame:
      rule: "Host(`caronboulme.fr`) && PathPrefix(`/cert`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: sesame-service
      middlewares:
        - local-networks-only

    # Immich Book - Logged out page (no auth)
    photobook-logged-out:
      rule: "Host(`photobook.caronboulme.fr`) && PathPrefix(`/logged-out`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photobook-service
      priority: 100

    # Immich Book - Photo book generator (Authentik SSO)
    photobook:
      rule: "Host(`photobook.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photobook-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # Contes - Wiki des contes audio (Authentik SSO, migré depuis VK — aucun
    # appelant service-à-service trouvé pour l'host public, wiki-agent y accède
    # en interne via Docker DNS, pas via cette route)
    contes:
      rule: "Host(`contes.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: contes-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # Maestro - Wiki de la discothèque (Authentik SSO). Le provider
    # "Forward Auth maestro" est rattaché à l'outpost embarqué, comme celui de
    # contes : sans ce rattachement le middleware refuserait la requête.
    # La recherche du wiki est servie par l'agent (/search, /similar) et non par
    # MkDocs, dont l'index pèserait ~147 Mo à l'échelle du catalogue.
    maestro:
      rule: "Host(`maestro.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: maestro-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # News - Wiki des sujets d'actualité consolidés (Authentik SSO, migré depuis
    # VK — même remarque que contes ci-dessus)
    news:
      rule: "Host(`news.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: news-service
      middlewares:
        - authentik-sso
        - allow-frame-nextcloud

    # Familytree - Logged out page (no auth)
    familytree-logged-out:
      rule: "Host(`people.caronboulme.fr`) && PathPrefix(`/logged-out`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-frontend-service
      priority: 100

    # Familytree Frontend - Arbre familial / relations Immich (Authentik SSO)
    familytree-frontend:
      rule: "Host(`people.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-frontend-service
      middlewares:
        - authentik-sso

    # Familytree Backend API - Direct API access
    familytree-backend:
      rule: "Host(`people.caronboulme.fr`) && PathPrefix(`/api/`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-backend-service
      middlewares:
        - authentik-sso
      priority: 100

  services:
    # vLLM FastAPI Service
    vllm-service:
      loadBalancer:
        servers:
          - url: "http://thebrain:8000"

    vllm-think-service:
      loadBalancer:
        servers:
          - url: "http://thebrain:9000"

    # Unmute Services
    tts-service:
      loadBalancer:
        servers:
          - url: "http://unmute-tts-1:8080"

    stt-service:
      loadBalancer:
        servers:
          - url: "http://unmute-stt-1:8080"

    # Panoramix Backend Service
    panoramix-backend-service:
      loadBalancer:
        servers:
          - url: "http://panoramix-backend:12345"

    # Panoramix Frontend Service
    panoramix-frontend-service:
      loadBalancer:
        servers:
          - url: "http://panoramix-frontend:80"

    # Authentik Service - OIDC Provider
    authentik-service:
      loadBalancer:
        servers:
          - url: "http://authentik_server:9000"

    # Photos Service - Immich Server
    photos-service:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"

    # Nextcloud Service - hébergé sur nestor (192.168.1.224)
    nextcloud-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.224:8180"

    # Collabora Online (nestor)
    collabora-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.224:9980"

    # Jellyfin (nestor)
    jellyfin-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.224:8096"

    # Z-Anime - interface web (nestor)
    zanime-ui-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.224:8189"

    # Z-Anime (nestor) - ComfyUI
    zanime-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.224:8188"

    # Kavita (nestor)
    kavita-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.224:5050"

    # Ren'Py (nestor)
    renpy-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.224:8480"

    # Sesame Service - Serveur de certificats CA
    sesame-service:
      loadBalancer:
        servers:
          - url: "http://sesame:8080"

    # VoxCPM2 TTS Service
    voxcpm2-service:
      loadBalancer:
        servers:
          - url: "http://voxcpm2-api:8000"

    # MusicGen Service - conteneur "musicgen" (ace-step-ui) sur le réseau
    # ansible, qui appelle lui-même l'API REST d'ACE-Step sur nestor
    # (192.168.1.224:8001) — remplace l'ancien accès direct au Gradio de
    # nestor, désormais désactivé au profit du mode API.
    musicgen-service:
      loadBalancer:
        servers:
          - url: "http://musicgen:3000"

    # VSCode Server - code-server
    code-service:
      loadBalancer:
        servers:
          - url: "http://code-server:8080"

    # Immich Book Service
    photobook-service:
      loadBalancer:
        servers:
          - url: "http://immich-book-frontend:80"

    # Contes Service - wiki + API de recherche sémantique (même conteneur que
    # l'agent MQTT, voir contes-agent/main.py)
    contes-service:
      loadBalancer:
        servers:
          - url: "http://contes-agent:8000"

    # Maestro Service - wiki statique + API de recherche et de similarité
    # sonore (même conteneur que l'agent MQTT, voir maestro/main.py)
    maestro-service:
      loadBalancer:
        servers:
          - url: "http://maestro:8000"

    # News Service - wiki des sujets consolidés + API de recherche sémantique
    # (même conteneur que le pipeline bulletin, voir agent-news/main.py)
    news-service:
      loadBalancer:
        servers:
          - url: "http://agent-news:8080"

    # Familytree Frontend Service
    familytree-frontend-service:
      loadBalancer:
        servers:
          - url: "http://familytree-frontend:80"

    # Familytree Backend Service
    familytree-backend-service:
      loadBalancer:
        servers:
          - url: "http://familytree-backend:8000"

