http:
  middlewares:
    # Authentification service-à-service via JWT Authentik (Bearer), sans
    # redirection navigateur — utilisé pour thebrain/unmute (voir
    # mosquitto-auth-authentik/main.py::forwardauth).
    authentik-bearer:
      forwardAuth:
        address: "http://mosquitto-auth-authentik:8080/forwardauth"
        trustForwardHeader: true
        authRequestHeaders:
          - Authorization
          - X-API-Key

    # Redirect www and root domain to assistant
    redirect-to-assistant:
      redirectRegex:
        regex: "^https://(www\\.)?caronboulme\\.fr(/.*)?$"
        replacement: "https://chat.caronboulme.fr${2}"
        permanent: true

    # Restriction aux réseaux locaux pour l'endpoint /cert
    local-networks-only:
      ipAllowList:
        sourceRange:
          - "192.168.1.0/24"
          - "192.168.2.0/24"
          - "127.0.0.1/32"

    # Authentik ForwardAuth - Authentification SSO réutilisable pour plusieurs services
    authentik-sso:
      forwardAuth:
        address: "http://authentik_server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Authentik-Username
          - X-Authentik-Groups
          - X-Authentik-Email
          - X-Authentik-Name
          - X-Authentik-Uid
          - X-Authentik-Jwt
          - X-Authentik-Meta-Jwks
          - X-Authentik-Meta-Outpost
          - X-Authentik-Meta-Provider
          - X-Authentik-Meta-App
          - X-Authentik-Meta-Version


  routers:
    # Redirect root and www domains to assistant
    root-redirect:
      rule: "Host(`caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      middlewares:
        - redirect-to-assistant
        
    www-redirect:
      rule: "Host(`www.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      middlewares:
        - redirect-to-assistant

    # vLLM FastAPI - The Brain (API key only)
    thebrain:
      rule: "Host(`thebrain.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: vllm-service
      middlewares:
        - authentik-bearer

        # vLLM FastAPI - The Brain (API key only)
    thebrain-think:
      rule: "Host(`thebrain-think.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: vllm-think-service
      middlewares:
        - authentik-bearer

    # TTS Service - Unmute Talk (API key only)
    unmute-talk:
      rule: "Host(`unmute-talk.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: tts-service
      middlewares:
        - authentik-bearer

    # STT Service - Unmute Transcript (API key only)
    unmute-transcript:
      rule: "Host(`unmute-transcript.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: stt-service
      middlewares:
        - authentik-bearer

    # VSCode Server - code-server (Authentik SSO, migré depuis VK — aucun
    # appelant service-à-service trouvé pour cet host, contrairement à voxcpm2)
    code:
      rule: "Host(`code.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: code-service
      middlewares:
        - authentik-sso

    # VoxCPM2 TTS Service (Authentik SSO, migré depuis VK — panoramix l'appelle
    # en interne via Docker DNS, joshua était le seul appelant public, arrêté)
    voxcpm2:
      rule: "Host(`voxcpm2.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: voxcpm2-service
      middlewares:
        - authentik-sso

    # MusicGen - interface Gradio hébergée sur la machine locale nestor (hors
    # Docker) — Authentik SSO, même pattern que voxcpm2 : accès navigateur
    # uniquement, aucun appelant service-à-service
    musicgen:
      rule: "Host(`musicgen.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: musicgen-service
      middlewares:
        - authentik-sso

    # Traefik Dashboard - Authentik SSO, migré depuis VK — restreint au groupe
    # "authentik Admins" côté Authentik (Policy Binding), pas ouvert à tous les
    # utilisateurs contrairement aux autres routes migrées
    traefik-dashboard:
      rule: "Host(`traefik.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: api@internal
      middlewares:
        - authentik-sso

    # Panoramix Backend - Authentik SSO (migré depuis VK, même pattern que
    # joshua-backend-api) - handle_client lit X-Authentik-Username injecté par
    # Traefik au lieu du cookie vk_session
    panoramix-backend-api:
      rule: "Host(`panoramix.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-backend-service
      middlewares:
        - authentik-sso

    # Panoramix Frontend - page de déconnexion publique (pas de authentik-sso —
    # sinon le retour de post_logout_redirect_uri redéclenche immédiatement une
    # nouvelle authentification), même pattern que photobook-logged-out
    panoramix-logged-out:
      rule: "Host(`chat.caronboulme.fr`) && PathPrefix(`/logged-out`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      priority: 100

    # Panoramix Frontend - chat.caronboulme.fr (Authentik SSO, migré depuis VK)
    panoramix-frontend:
      rule: "Host(`chat.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      middlewares:
        - authentik-sso

    # Authentik - Fournisseur OIDC (dédié à Immich pour l'instant, delegue à Google)
    sso:
      rule: "Host(`sso.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: authentik-service

    # Photos Service - Immich (no authentication - public access)
    photos:
      rule: "Host(`photos.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photos-service

    # Cloud Service - Seafile (gère sa propre authentification OIDC via Authentik)
    cloud:
      rule: "Host(`cloud.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: seafile-service

    # Sesame - Serveur de certificats CA (accès local uniquement)
    sesame:
      rule: "Host(`caronboulme.fr`) && PathPrefix(`/cert`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: sesame-service
      middlewares:
        - local-networks-only

    # Alfred Frontend - Liste Service (Authentik SSO, migré depuis VK — note :
    # l'identité par-utilisateur d'alfred était déjà cassée côté VK avant cette
    # migration, le backend lisant X-Remote-User/etc jamais réellement injectés ;
    # cette bascule ne fait que migrer la porte d'entrée, pas ce défaut
    # préexistant)
    alfred-frontend:
      rule: "Host(`liste.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: alfred-frontend-service
      middlewares:
        - authentik-sso

    # Alfred Backend API - Direct API access (Authentik SSO, migré depuis VK)
    alfred-backend:
      rule: "Host(`liste.caronboulme.fr`) && PathPrefix(`/api/`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: alfred-backend-service
      middlewares:
        - authentik-sso
      priority: 100

    # Immich Book - Logged out page (no auth)
    photobook-logged-out:
      rule: "Host(`photobook.caronboulme.fr`) && PathPrefix(`/logged-out`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photobook-service
      priority: 100

    # Immich Book - Photo book generator (Authentik SSO)
    photobook:
      rule: "Host(`photobook.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photobook-service
      middlewares:
        - authentik-sso

    # Contes - Wiki des contes audio (Authentik SSO, migré depuis VK — aucun
    # appelant service-à-service trouvé pour l'host public, wiki-agent y accède
    # en interne via Docker DNS, pas via cette route)
    contes:
      rule: "Host(`contes.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: contes-service
      middlewares:
        - authentik-sso

    # News - Wiki des sujets d'actualité consolidés (Authentik SSO, migré depuis
    # VK — même remarque que contes ci-dessus)
    news:
      rule: "Host(`news.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: news-service
      middlewares:
        - authentik-sso

    # Familytree - Logged out page (no auth)
    familytree-logged-out:
      rule: "Host(`people.caronboulme.fr`) && PathPrefix(`/logged-out`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-frontend-service
      priority: 100

    # Familytree Frontend - Arbre familial / relations Immich (Authentik SSO)
    familytree-frontend:
      rule: "Host(`people.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-frontend-service
      middlewares:
        - authentik-sso

    # Familytree Backend API - Direct API access
    familytree-backend:
      rule: "Host(`people.caronboulme.fr`) && PathPrefix(`/api/`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-backend-service
      middlewares:
        - authentik-sso
      priority: 100

  services:
    # vLLM FastAPI Service
    vllm-service:
      loadBalancer:
        servers:
          - url: "http://thebrain:8000"

    vllm-think-service:
      loadBalancer:
        servers:
          - url: "http://thebrain:9000"

    # Unmute Services
    tts-service:
      loadBalancer:
        servers:
          - url: "http://unmute-tts-1:8080"

    stt-service:
      loadBalancer:
        servers:
          - url: "http://unmute-stt-1:8080"

    # Panoramix Backend Service
    panoramix-backend-service:
      loadBalancer:
        servers:
          - url: "http://panoramix-backend:12345"

    # Panoramix Frontend Service
    panoramix-frontend-service:
      loadBalancer:
        servers:
          - url: "http://panoramix-frontend:80"

    # Authentik Service - OIDC Provider
    authentik-service:
      loadBalancer:
        servers:
          - url: "http://authentik_server:9000"

    # Photos Service - Immich Server
    photos-service:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"

    # Seafile Service - Cloud Storage (VM johnny)
    seafile-service:
      loadBalancer:
        servers:
          - url: "http://johnny:8000"

    # Sesame Service - Serveur de certificats CA
    sesame-service:
      loadBalancer:
        servers:
          - url: "http://sesame:8080"

    # Alfred Frontend Service
    alfred-frontend-service:
      loadBalancer:
        servers:
          - url: "http://alfred-frontend:80"

    # Alfred Backend Service
    alfred-backend-service:
      loadBalancer:
        servers:
          - url: "http://alfred-backend:8000"

    # VoxCPM2 TTS Service
    voxcpm2-service:
      loadBalancer:
        servers:
          - url: "http://voxcpm2-api:8000"

    # MusicGen Service - Gradio sur la machine nestor (192.168.1.224), résolu
    # par le DNS de l'hôte comme johnny pour Seafile
    musicgen-service:
      loadBalancer:
        servers:
          - url: "http://nestor:7860"

    # VSCode Server - code-server
    code-service:
      loadBalancer:
        servers:
          - url: "http://code-server:8080"

    # Immich Book Service
    photobook-service:
      loadBalancer:
        servers:
          - url: "http://immich-book-frontend:80"

    # Contes Service - wiki + API de recherche sémantique (même conteneur que
    # l'agent MQTT, voir contes-agent/main.py)
    contes-service:
      loadBalancer:
        servers:
          - url: "http://contes-agent:8000"

    # News Service - wiki des sujets consolidés + API de recherche sémantique
    # (même conteneur que le pipeline bulletin, voir agent-news/main.py)
    news-service:
      loadBalancer:
        servers:
          - url: "http://agent-news:8080"

    # Familytree Frontend Service
    familytree-frontend-service:
      loadBalancer:
        servers:
          - url: "http://familytree-frontend:80"

    # Familytree Backend Service
    familytree-backend-service:
      loadBalancer:
        servers:
          - url: "http://familytree-backend:8000"

