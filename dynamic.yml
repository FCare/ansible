http:
  middlewares:
    # Hybrid Authentication middleware (API Key + Cookie)
    # Auto-detects admin requirements (traefik service)
    vk-hybrid:
      forwardAuth:
        address: "http://voight-kampff:8080/verify"
        trustForwardHeader: true
        authRequestHeaders:
          - Authorization
          - X-API-Key
          - Cookie
          - Accept
        authResponseHeaders:
          - X-VK-User
          - X-VK-Service
          - X-VK-Scopes
          - X-VK-Admin
    
    # API Key-only authentication (services)
    vk-api-only:
      forwardAuth:
        address: "http://voight-kampff:8080/verify"
        trustForwardHeader: true
        authRequestHeaders:
          - Authorization
          - X-API-Key
        authResponseHeaders:
          - X-VK-User
          - X-VK-Service
          - X-VK-Scopes
          - X-VK-Admin
    
    # Redirect www and root domain to assistant
    redirect-to-assistant:
      redirectRegex:
        regex: "^https://(www\\.)?caronboulme\\.fr(/.*)?$"
        replacement: "https://assistant.caronboulme.fr${2}"
        permanent: true

    # Restriction aux réseaux locaux pour l'endpoint /cert
    local-networks-only:
      ipAllowList:
        sourceRange:
          - "192.168.1.0/24"
          - "192.168.2.0/24"
          - "127.0.0.1/32"

    # Authentik ForwardAuth - Authentification SSO réutilisable pour plusieurs services
    authentik-sso:
      forwardAuth:
        address: "http://authentik_server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Authentik-Username
          - X-Authentik-Groups
          - X-Authentik-Email
          - X-Authentik-Name
          - X-Authentik-Uid
          - X-Authentik-Jwt
          - X-Authentik-Meta-Jwks
          - X-Authentik-Meta-Outpost
          - X-Authentik-Meta-Provider
          - X-Authentik-Meta-App
          - X-Authentik-Meta-Version


  routers:
    # Auth Service - Web Interface
    auth:
      rule: "Host(`auth.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: auth-service

    # Redirect root and www domains to assistant
    root-redirect:
      rule: "Host(`caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: joshua-frontend-service
      middlewares:
        - redirect-to-assistant
        
    www-redirect:
      rule: "Host(`www.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: joshua-frontend-service
      middlewares:
        - redirect-to-assistant

    # vLLM FastAPI - The Brain (API key only)
    thebrain:
      rule: "Host(`thebrain.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: vllm-service
      middlewares:
        - vk-api-only

        # vLLM FastAPI - The Brain (API key only)
    thebrain-think:
      rule: "Host(`thebrain-think.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: vllm-think-service
      middlewares:
        - vk-api-only

    # TTS Service - Unmute Talk (API key only)
    unmute-talk:
      rule: "Host(`unmute-talk.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: tts-service
      middlewares:
        - vk-api-only

    # STT Service - Unmute Transcript (API key only)
    unmute-transcript:
      rule: "Host(`unmute-transcript.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: stt-service
      middlewares:
        - vk-api-only

    # VSCode Server - code-server (IDE distant, hybrid auth: cookie + API key)
    code:
      rule: "Host(`code.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: code-service
      middlewares:
        - vk-hybrid

    # VoxCPM2 TTS Service (hybrid auth: cookie + API key)
    voxcpm2:
      rule: "Host(`voxcpm2.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: voxcpm2-service
      middlewares:
        - vk-hybrid

    # Chatterbox TTS Service (API key only)
    chatterbox:
      rule: "Host(`chatterbox.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: chatterbox-service
      middlewares:
        - vk-api-only

    # Traefik Dashboard - Admin only (hybrid auth for admin detection)
    traefik-dashboard:
      rule: "Host(`traefik.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: api@internal
      middlewares:
        - vk-hybrid

    # Joshua Backend API - API Key Only (for programmatic access)
    joshua-backend-api:
      rule: "Host(`joshua.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: joshua-backend-service

    # Joshua Frontend - Assistant Service (cookie authentication)
    joshua-frontend:
      rule: "Host(`assistant.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: joshua-frontend-service
      middlewares:
        - vk-hybrid

    # Panoramix Backend - joshua persona sur le cascading panoramix (auth VK
    # gérée par le backend lui-même via le cookie vk_session, comme joshua-backend-api)
    panoramix-backend-api:
      rule: "Host(`panoramix.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-backend-service

    # Panoramix Frontend - chat.caronboulme.fr (cookie authentication)
    panoramix-frontend:
      rule: "Host(`chat.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: panoramix-frontend-service
      middlewares:
        - vk-hybrid

    # Authentik - Fournisseur OIDC (dédié à Immich pour l'instant, delegue à Google)
    sso:
      rule: "Host(`sso.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: authentik-service

    # Photos Service - Immich (no authentication - public access)
    photos:
      rule: "Host(`photos.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photos-service

    # Pocket TTS - French TTS API (hybrid auth: cookie + API key)
    pocket-tts:
      rule: "Host(`pocket-tts.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: pocket-tts-service
      middlewares:
        - vk-hybrid
      priority: 10

    # Sesame - Serveur de certificats CA (accès local uniquement)
    sesame:
      rule: "Host(`caronboulme.fr`) && PathPrefix(`/cert`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: sesame-service
      middlewares:
        - local-networks-only

    # Alfred Frontend - Liste Service (hybrid authentication)
    alfred-frontend:
      rule: "Host(`liste.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: alfred-frontend-service
      middlewares:
        - vk-hybrid

    # Alfred Backend API - Direct API access
    alfred-backend:
      rule: "Host(`liste.caronboulme.fr`) && PathPrefix(`/api/`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: alfred-backend-service
      middlewares:
        - vk-hybrid
      priority: 100

    # Immich Book - Logged out page (no auth)
    photobook-logged-out:
      rule: "Host(`photobook.caronboulme.fr`) && PathPrefix(`/logged-out`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photobook-service
      priority: 100

    # Immich Book - Photo book generator (Authentik SSO)
    photobook:
      rule: "Host(`photobook.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: photobook-service
      middlewares:
        - authentik-sso

    # Contes - Wiki des contes audio (hybrid auth: cookie + API key)
    contes:
      rule: "Host(`contes.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: contes-service
      middlewares:
        - vk-hybrid

    # News - Wiki des sujets d'actualité consolidés (hybrid auth: cookie + API key)
    news:
      rule: "Host(`news.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: news-service
      middlewares:
        - vk-hybrid

    # Familytree Frontend - Arbre familial / relations Immich (hybrid authentication)
    familytree-frontend:
      rule: "Host(`people.caronboulme.fr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-frontend-service
      middlewares:
        - vk-hybrid

    # Familytree Backend API - Direct API access
    familytree-backend:
      rule: "Host(`people.caronboulme.fr`) && PathPrefix(`/api/`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: familytree-backend-service
      middlewares:
        - vk-hybrid
      priority: 100

  services:
    # Auth Service - Voight-Kampff Web Interface
    auth-service:
      loadBalancer:
        servers:
          - url: "http://voight-kampff:8080"

    # vLLM FastAPI Service
    vllm-service:
      loadBalancer:
        servers:
          - url: "http://thebrain:8000"

    vllm-think-service:
      loadBalancer:
        servers:
          - url: "http://thebrain:9000"

    # Unmute Services
    tts-service:
      loadBalancer:
        servers:
          - url: "http://unmute-tts-1:8080"

    stt-service:
      loadBalancer:
        servers:
          - url: "http://unmute-stt-1:8080"

    # Chatterbox Service
    chatterbox-service:
      loadBalancer:
        servers:
          - url: "http://chatterbox-tts-api-blackwell:4123"

    # Joshua Backend Service
    joshua-backend-service:
      loadBalancer:
        servers:
          - url: "http://joshua-backend:8769"

    # Joshua Frontend Service
    joshua-frontend-service:
      loadBalancer:
        servers:
          - url: "http://joshua-frontend:80"

    # Panoramix Backend Service
    panoramix-backend-service:
      loadBalancer:
        servers:
          - url: "http://panoramix-backend:12345"

    # Panoramix Frontend Service
    panoramix-frontend-service:
      loadBalancer:
        servers:
          - url: "http://panoramix-frontend:80"

    # Authentik Service - OIDC Provider
    authentik-service:
      loadBalancer:
        servers:
          - url: "http://authentik_server:9000"

    # Photos Service - Immich Server
    photos-service:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"
    # Sesame Service - Serveur de certificats CA
    sesame-service:
      loadBalancer:
        servers:
          - url: "http://sesame:8080"

    # Alfred Frontend Service
    alfred-frontend-service:
      loadBalancer:
        servers:
          - url: "http://alfred-frontend:80"

    # Alfred Backend Service
    alfred-backend-service:
      loadBalancer:
        servers:
          - url: "http://alfred-backend:8000"

    # Pocket TTS Service
    pocket-tts-service:
      loadBalancer:
        servers:
          - url: "http://pocket-tts:8000"

    # VoxCPM2 TTS Service
    voxcpm2-service:
      loadBalancer:
        servers:
          - url: "http://voxcpm2-api:8000"

    # VSCode Server - code-server
    code-service:
      loadBalancer:
        servers:
          - url: "http://code-server:8080"

    # Immich Book Service
    photobook-service:
      loadBalancer:
        servers:
          - url: "http://immich-book-frontend:80"

    # Contes Service - wiki + API de recherche sémantique (même conteneur que
    # l'agent MQTT, voir contes-agent/main.py)
    contes-service:
      loadBalancer:
        servers:
          - url: "http://contes-agent:8000"

    # News Service - wiki des sujets consolidés + API de recherche sémantique
    # (même conteneur que le pipeline bulletin, voir agent-news/main.py)
    news-service:
      loadBalancer:
        servers:
          - url: "http://agent-news:8080"

    # Familytree Frontend Service
    familytree-frontend-service:
      loadBalancer:
        servers:
          - url: "http://familytree-frontend:80"

    # Familytree Backend Service
    familytree-backend-service:
      loadBalancer:
        servers:
          - url: "http://familytree-backend:8000"

